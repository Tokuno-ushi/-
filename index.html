
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap');
  :root {
    --ink: #1a1208;
    --ink-light: #3d3020;
    --ink-faint: #7a6a55;
    --paper: #f5f0e8;
    --paper-dark: #ede5d4;
    --paper-deep: #d4c9b0;
    --gold: #a07840;
    --gold-light: #c9a060;
    --red: #8b2020;
    --red-light: #c04040;
    --jade: #2d6b52;
    --jade-light: #4a9070;
    --border: rgba(100,80,40,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Serif SC', serif; background: var(--paper); color: var(--ink); }

  nav { background: var(--ink); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--gold); }
  .nav-brand { font-family: 'Ma Shan Zheng', serif; font-size: 22px; color: var(--gold-light); letter-spacing: 4px; }
  .nav-links { display: flex; }
  .nav-link { color: rgba(245,240,232,0.7); font-size: 13px; padding: 0 16px; height: 56px; display: flex; align-items: center; cursor: pointer; transition: all 0.2s; letter-spacing: 2px; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .nav-link:hover, .nav-link.active { color: var(--gold-light); border-bottom-color: var(--gold-light); }

  .section { display: none; padding: 2rem; max-width: 1100px; margin: 0 auto; }
  .section.active { display: block; }

  #hero { display: block; background: var(--paper-dark); border-bottom: 1px solid var(--border); padding: 3.5rem 2rem; text-align: center; position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; opacity: 0.05; background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='80' font-size='80' fill='%231a1208' font-family='serif'%3E吳%3C/text%3E%3Ctext x='100' y='180' font-size='60' fill='%231a1208' font-family='serif'%3E中%3C/text%3E%3C/svg%3E"); background-size: 200px; }
  .hero-title { font-family: 'Ma Shan Zheng', serif; font-size: 52px; color: var(--ink); letter-spacing: 10px; position: relative; }
  .hero-sub { font-size: 13px; color: var(--ink-faint); letter-spacing: 4px; margin-top: 10px; position: relative; }
  .hero-desc { font-size: 13px; color: var(--ink-faint); letter-spacing: 3px; margin-top: 20px; position: relative; line-height: 2; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: inline-block; padding: 10px 2rem; }
  .hero-cta { display: inline-flex; gap: 12px; margin-top: 2rem; position: relative; }
  .btn-primary { background: var(--ink); color: var(--gold-light); padding: 10px 24px; font-family: 'Noto Serif SC', serif; font-size: 13px; letter-spacing: 2px; cursor: pointer; border: 1px solid var(--gold); transition: all 0.2s; }
  .btn-primary:hover { background: var(--gold); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--ink-faint); padding: 10px 24px; font-family: 'Noto Serif SC', serif; font-size: 13px; letter-spacing: 2px; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s; }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  .sec-header { display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem; }
  .sec-title { font-family: 'Ma Shan Zheng', serif; font-size: 26px; color: var(--ink); letter-spacing: 3px; }
  .sec-line { flex: 1; height: 1px; background: var(--border); }
  .sec-badge { font-size: 11px; color: var(--ink-faint); letter-spacing: 1px; border: 1px solid var(--border); padding: 2px 10px; }

  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
  .filter-label { font-size: 12px; color: var(--ink-faint); letter-spacing: 1px; }
  .filter-btn { font-size: 12px; padding: 5px 14px; background: transparent; border: 1px solid var(--border); color: var(--ink-faint); cursor: pointer; font-family: 'Noto Serif SC', serif; letter-spacing: 1px; transition: all 0.2s; }
  .filter-btn.active, .filter-btn:hover { background: var(--ink); color: var(--gold-light); border-color: var(--ink); }
  .search-input { padding: 7px 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.5); font-family: 'Noto Serif SC', serif; font-size: 13px; color: var(--ink); outline: none; flex: 1; min-width: 200px; }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--ink-faint); }

  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1px; border: 1px solid var(--border); background: var(--border); }
  .person-card { background: var(--paper); padding: 1rem; cursor: pointer; transition: all 0.2s; }
  .person-card:hover { background: var(--paper-dark); }
  .person-name { font-family: 'Ma Shan Zheng', serif; font-size: 20px; color: var(--ink); letter-spacing: 2px; }
  .person-dynasty { font-size: 11px; color: var(--ink-faint); margin-top: 3px; letter-spacing: 1px; }
  .person-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tag { font-size: 10px; padding: 2px 7px; letter-spacing: 0.5px; }
  .tag-xiao { background: rgba(139,32,32,0.1); color: var(--red); border: 1px solid rgba(139,32,32,0.2); }
  .tag-zhong { background: rgba(45,107,82,0.1); color: var(--jade); border: 1px solid rgba(45,107,82,0.2); }
  .tag-li { background: rgba(160,120,64,0.1); color: var(--gold); border: 1px solid rgba(160,120,64,0.2); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,18,8,0.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--paper); max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border); position: relative; }
  .modal-header { background: var(--ink); padding: 1.5rem 2rem; border-bottom: 2px solid var(--gold); }
  .modal-name { font-family: 'Ma Shan Zheng', serif; font-size: 32px; color: var(--gold-light); letter-spacing: 4px; }
  .modal-meta { font-size: 12px; color: rgba(245,240,232,0.6); margin-top: 6px; letter-spacing: 1px; }
  .modal-body { padding: 1.5rem 2rem; }
  .modal-section { margin-bottom: 1.2rem; }
  .modal-sec-title { font-size: 11px; color: var(--ink-faint); letter-spacing: 2px; margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .modal-text { font-size: 14px; line-height: 1.9; color: var(--ink-light); }
  .modal-quote { font-size: 13px; color: var(--ink-faint); border-left: 3px solid var(--gold); padding-left: 12px; margin-top: 8px; line-height: 1.8; font-style: italic; }
  .modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; border: 1px solid rgba(245,240,232,0.3); color: rgba(245,240,232,0.6); width: 28px; height: 28px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .modal-close:hover { border-color: var(--gold-light); color: var(--gold-light); }

  .dynasty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .dynasty-name { font-size: 13px; font-weight: 600; color: var(--ink); min-width: 80px; letter-spacing: 1px; text-align: right; }
  .dynasty-track { flex: 1; position: relative; height: 32px; }
  .dynasty-fill { height: 100%; display: flex; align-items: center; padding: 0 10px; font-size: 11px; color: white; letter-spacing: 1px; }
  .dynasty-count { font-size: 13px; color: var(--ink-faint); min-width: 40px; }

  .map-container { border: 1px solid var(--border); background: #e8f0e4; height: 380px; position: relative; overflow: hidden; }
  .map-svg { width: 100%; height: 100%; }
  .map-tooltip { position: absolute; background: var(--ink); color: var(--gold-light); padding: 6px 12px; font-size: 12px; pointer-events: none; display: none; letter-spacing: 1px; border: 1px solid var(--gold); font-family: 'Noto Serif SC', serif; }
  .map-legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .map-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-faint); }

  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .chart-card { background: var(--paper); border: 1px solid var(--border); padding: 1.25rem; }
  .chart-title { font-size: 12px; color: var(--ink-faint); letter-spacing: 2px; margin-bottom: 1rem; }

  .quiz-container { max-width: 600px; margin: 0 auto; }
  .quiz-intro { text-align: center; padding: 2.5rem; border: 1px solid var(--border); background: var(--paper-dark); margin-bottom: 1.5rem; }
  .quiz-intro-title { font-family: 'Ma Shan Zheng', serif; font-size: 28px; color: var(--ink); letter-spacing: 4px; }
  .quiz-intro-text { font-size: 13px; color: var(--ink-faint); margin-top: 10px; line-height: 2; letter-spacing: 1px; }
  .quiz-progress { display: flex; gap: 4px; margin-bottom: 1.5rem; }
  .progress-dot { flex: 1; height: 3px; background: var(--border); transition: all 0.3s; }
  .progress-dot.done { background: var(--gold); }
  .progress-dot.active { background: var(--ink); }
  .quiz-q { font-size: 16px; color: var(--ink); line-height: 1.9; margin-bottom: 1.2rem; letter-spacing: 0.5px; }
  .quiz-q-label { font-size: 11px; color: var(--ink-faint); letter-spacing: 2px; margin-bottom: 8px; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option { padding: 12px 16px; border: 1px solid var(--border); background: var(--paper); cursor: pointer; font-family: 'Noto Serif SC', serif; font-size: 13px; color: var(--ink-light); text-align: left; transition: all 0.2s; letter-spacing: 0.5px; line-height: 1.6; }
  .quiz-option:hover { background: var(--paper-dark); border-color: var(--gold); color: var(--ink); }
  .quiz-result { text-align: center; padding: 2rem; border: 1px solid var(--gold); background: var(--paper-dark); }
  .result-name { font-family: 'Ma Shan Zheng', serif; font-size: 40px; color: var(--ink); letter-spacing: 6px; margin-bottom: 8px; }
  .result-dynasty { font-size: 12px; color: var(--ink-faint); letter-spacing: 3px; margin-bottom: 1rem; }
  .result-desc { font-size: 13px; color: var(--ink-light); line-height: 1.9; margin-bottom: 1.5rem; max-width: 400px; margin-left: auto; margin-right: auto; }
</style>

<div id="app">
  <nav>
    <span class="nav-brand">吳中人物志</span>
    <div class="nav-links">
      <div class="nav-link active" onclick="showSection('people')">群贤列传</div>
      <div class="nav-link" onclick="showSection('timeline')">朝代年表</div>
      <div class="nav-link" onclick="showSection('map')">宦迹舆图</div>
      <div class="nav-link" onclick="showSection('stats')">风节品鉴</div>
      <div class="nav-link" onclick="showSection('quiz')">对镜问心</div>
    </div>
  </nav>

  <div id="hero">
    <div class="hero-bg"></div>
    <h1 class="hero-title">吴中人物志</h1>
    <p class="hero-sub">千载吴地文脉 · 贤人志行存录</p>
    <div class="hero-desc">
      百四十四贤 · 孝友忠义吏治三卷 · 上迄春秋下至明代
    </div>
    <div class="hero-cta">
      <button class="btn-primary" onclick="showSection('people')">入卷览贤</button>
      <button class="btn-ghost" onclick="showSection('quiz')">对镜问心</button>
    </div>
  </div>

  <div id="sec-people" class="section active">
    <div class="sec-header">
      <span class="sec-title">群贤列传</span>
      <div class="sec-line"></div>
      <span class="sec-badge" id="people-count">共一百四十四人</span>
    </div>
    <div class="filter-bar">
      <span class="filter-label">卷类：</span>
      <button class="filter-btn active" onclick="filterPeople('all',this)">全部</button>
      <button class="filter-btn" onclick="filterPeople('孝友',this)">孝友卷</button>
      <button class="filter-btn" onclick="filterPeople('忠义',this)">忠义卷</button>
      <button class="filter-btn" onclick="filterPeople('吏治',this)">吏治卷</button>
      <span class="filter-label" style="margin-left:8px">朝代：</span>
      <select id="dynasty-filter" onchange="filterByDynasty()" style="padding:5px 10px;border:1px solid var(--border);background:transparent;font-family:'Noto Serif SC',serif;font-size:12px;color:var(--ink);cursor:pointer;">
        <option value="all">全部朝代</option>
        <option>春秋</option><option>西汉</option><option>东汉</option><option>三国时期</option><option>三国（吴）</option><option>三国吴</option><option>西晋</option><option>东晋</option><option>南朝宋</option><option>南朝齐</option><option>南朝梁</option><option>南朝陈</option><option>唐</option><option>宋</option><option>元</option><option>明</option>
      </select>
      <input class="search-input" placeholder="搜索人名、行为标签…" oninput="searchPeople(this.value)" />
    </div>
    <div class="people-grid" id="people-grid"></div>
  </div>

  <div id="sec-timeline" class="section">
    <div class="sec-header">
      <span class="sec-title">朝代年表</span>
      <div class="sec-line"></div>
      <span class="sec-badge">按人物数量</span>
    </div>
    <div id="timeline-content"></div>
  </div>

  <div id="sec-map" class="section">
    <div class="sec-header">
      <span class="sec-title">宦迹舆图</span>
      <div class="sec-line"></div>
      <span class="sec-badge">江南地区</span>
    </div>
    <div class="map-container" id="map-container">
      <div class="map-tooltip" id="map-tooltip"></div>
    </div>
    <div class="map-legend" id="map-legend"></div>
  </div>

  <div id="sec-stats" class="section">
    <div class="sec-header">
      <span class="sec-title">风节品鉴</span>
      <div class="sec-line"></div>
      <span class="sec-badge">行为标签 · 价值关键词</span>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">三卷人数分布</div>
        <div style="position:relative;height:220px"><canvas id="chart-juan" role="img" aria-label="三卷人数：吏治78人，孝友33人，忠义33人">三卷分布</canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">各朝代人物数量</div>
        <div style="position:relative;height:220px"><canvas id="chart-dynasty" role="img" aria-label="各朝代人物数量分布">朝代分布</canvas></div>
      </div>
      <div class="chart-card" style="grid-column:1/-1">
        <div class="chart-title">价值关键词频次</div>
        <div style="position:relative;height:200px"><canvas id="chart-values" role="img" aria-label="价值关键词出现频次">价值词频</canvas></div>
      </div>
    </div>
  </div>

  <div id="sec-quiz" class="section">
    <div class="sec-header">
      <span class="sec-title">对镜问心</span>
      <div class="sec-line"></div>
      <span class="sec-badge">互动问答</span>
    </div>
    <div class="quiz-container">
      <div class="quiz-intro" id="quiz-intro">
        <div class="quiz-intro-title">你是哪位吴中贤人？</div>
        <p class="quiz-intro-text">古人云：以铜为镜，可正衣冠；以人为镜，可知得失。<br>回答五问，照见你与哪位贤人志同道合。</p>
        <button class="btn-primary" style="margin-top:1.5rem" onclick="startQuiz()">展卷自问</button>
      </div>
      <div id="quiz-body" style="display:none">
        <div class="quiz-progress" id="quiz-progress"></div>
        <div id="quiz-question-wrap"></div>
      </div>
      <div id="quiz-result" style="display:none" class="quiz-result"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalBtn()">✕</button>
    <div class="modal-header" id="modal-header"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const PEOPLE = [
  {id:1,name:"张武",juan:"孝友",dynasty:"东汉",place:"浙江嘉兴",tags:["祭奠亡父"],values:["孝"],bio:"东汉吴郡人。幼年丧父，成年后常携父亲遗剑前往遇害处祭奠哭悼。后又因母亲去世悲伤过度，哀毁而死。",quote:"每节常持父遗剑，至亡处祭醊，泣而还。"},
  {id:2,name:"顾悌",juan:"孝友",dynasty:"三国时期",place:"江苏苏州",tags:["祭奠亡父","哀毁而卒"],values:["孝","悌","廉"],bio:"三国吴人。每次收到父亲来信，都会整肃衣冠、设席跪读。父亲去世后长期哀悼守丧，最终因悲伤过度而亡。",quote:"每得父书，洒扫设几筵，舒书其上，拜跪读之。"},
  {id:3,name:"陈遗",juan:"孝友",dynasty:"东晋",place:"江苏苏州",tags:["饮食奉母","德行感应"],values:["孝"],bio:"东晋吴郡人。因母亲喜欢锅巴，每次做饭都会专门收存焦饭奉母。战乱逃亡时仍随身携带，归家后其母因悲喜交加复明。",quote:"每煮食，辄剥其焦以贻母。"},
  {id:4,name:"顾训之",juan:"孝友",dynasty:"宋",place:"江苏苏州",tags:["治家雍睦","五代同居"],values:["孝","睦"],bio:"南朝宋人。家族五代同居，共有百余口人，家庭和睦兴盛，当时极受乡里敬重。",quote:"五代同居，子孙富盛，阖门雍睦，家有百口。"},
  {id:5,name:"顾昌衍",juan:"孝友",dynasty:"南朝齐",place:"江苏苏州",tags:["哀毁灭性"],values:["孝"],bio:"南朝齐吴郡人。因父母去世悲伤过度，哀毁几近丧命，以至孝闻名。",quote:"居丧几至灭性。"},
  {id:6,name:"张绪",juan:"忠义",dynasty:"南朝齐",place:"江苏苏州",tags:["直言进谏","忠心辅政"],values:["忠","直"],bio:"南朝齐名臣。性情淡雅，不汲汲名利，以清贵著称。善于书法，风姿卓异，时人称其有林下之风。",quote:""},
  {id:7,name:"张融",juan:"忠义",dynasty:"南朝齐",place:"江苏苏州",tags:["忠心报国"],values:["忠"],bio:"南朝齐文学家、书法家。性格豪放不羁，才华横溢，与王僧虔齐名。著有文集多卷。",quote:""},
  {id:8,name:"顾野王",juan:"吏治",dynasty:"南朝梁",place:"江苏苏州",tags:["博学著述","清廉守职"],values:["廉","勤"],bio:"南朝梁著名学者，字希冯。博通经史，精通文字学，著《玉篇》，为中国最早的楷书字典之一，对后世影响深远。",quote:""},
  {id:9,name:"陆德明",juan:"吏治",dynasty:"唐",place:"江苏苏州",tags:["博学鸿儒","经学传授"],values:["廉","仁"],bio:"唐初著名经学家，著《经典释文》三十卷，对保存魏晋南北朝的音韵学、训诂学资料贡献卓著。",quote:""},
  {id:10,name:"韦应物",juan:"吏治",dynasty:"唐",place:"江苏苏州",tags:["清廉勤政","爱民如子"],values:["廉","仁"],bio:"唐代著名诗人，曾任苏州刺史。为官清廉，体恤民情，诗风恬淡自然，与王维、孟浩然齐名。",quote:""},
  {id:11,name:"白居易",juan:"吏治",dynasty:"唐",place:"江苏苏州",tags:["造福百姓","疏浚水利"],values:["仁","廉"],bio:"唐代大诗人，曾任苏州刺史。主持疏浚山塘河，修建山塘街，至今惠泽苏州。诗作平易近人，广为传诵。",quote:""},
  {id:12,name:"刘禹锡",juan:"吏治",dynasty:"唐",place:"江苏苏州",tags:["勤政爱民","文学著述"],values:["廉","直"],bio:"唐代文学家，曾任苏州刺史。以诗文著称，与白居易唱和甚多，有"诗豪"之称。",quote:""},
  {id:13,name:"范仲淹",juan:"忠义",dynasty:"宋",place:"江苏苏州",tags:["忧国忧民","直言敢谏"],values:["忠","仁"],bio:"北宋著名政治家、文学家，苏州吴县人。著《岳阳楼记》，"先天下之忧而忧，后天下之乐而乐"成千古名言，主导庆历新政。",quote:"先天下之忧而忧，后天下之乐而乐。"},

let currentFilter='all', currentDynasty='all', currentSearch='';
let quizAnswers=[], currentQ=0;
const JUAN_COLORS={'孝友':'tag-xiao','忠义':'tag-zhong','吏治':'tag-li'};
const JUAN_BG={'孝友':'#8b2020','忠义':'#2d6b52','吏治':'#a07840'};

function countText(n){ return n===144?'共一百四十四人':`共 ${n} 人`; }

function renderPeople(){
  const grid=document.getElementById('people-grid');
  const f=PEOPLE.filter(p=>{
    const mj=currentFilter==='all'||p.juan===currentFilter;
    const md=currentDynasty==='all'||p.dynasty===currentDynasty;
    const ms=!currentSearch||p.name.includes(currentSearch)||(p.tags&&p.tags.join('').includes(currentSearch))||(p.values&&p.values.join('').includes(currentSearch));
    return mj&&md&&ms;
  });
  document.getElementById('people-count').textContent=`共 ${f.length} 人`;
  grid.innerHTML=f.map(p=>`
    <div class="person-card" onclick="openPerson(${p.id})">
      <div class="person-name">${p.name}</div>
      <div class="person-dynasty">${p.dynasty} · ${p.place||'吴中'}</div>
      <div class="person-tags">
        <span class="tag ${JUAN_COLORS[p.juan]||'tag-li'}">${p.juan}</span>
        ${p.values.slice(0,2).map(v=>`<span class="tag" style="background:rgba(100,80,40,0.08);color:var(--ink-faint);border:1px solid var(--border)">${v}</span>`).join('')}
      </div>
    </div>`).join('');
}

function filterPeople(v,btn){
  currentFilter=v;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPeople();
}
function filterByDynasty(){ currentDynasty=document.getElementById('dynasty-filter').value; renderPeople(); }
function searchPeople(v){ currentSearch=v; renderPeople(); }

function openPerson(id){
  const p=PEOPLE.find(x=>x.id===id); if(!p)return;
  document.getElementById('modal-header').innerHTML=`<div class="modal-name">${p.name}</div><div class="modal-meta">${p.dynasty} · ${p.place||'吴中'} · ${p.juan}卷</div>`;
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-section"><div class="modal-sec-title">白话简介</div><div class="modal-text">${p.bio}</div></div>
    ${p.quote?`<div class="modal-section"><div class="modal-sec-title">原文摘录</div><div class="modal-quote">${p.quote}</div></div>`:''}
    <div class="modal-section"><div class="modal-sec-title">标签</div><div class="person-tags" style="margin-top:6px">
      <span class="tag ${JUAN_COLORS[p.juan]||'tag-li'}">${p.juan}</span>
      ${p.values.map(v=>`<span class="tag" style="background:rgba(100,80,40,0.08);color:var(--ink-faint);border:1px solid var(--border)">${v}</span>`).join('')}
      ${p.tags.map(t=>`<span class="tag" style="background:rgba(45,107,82,0.07);color:var(--jade);border:1px solid rgba(45,107,82,0.2)">${t}</span>`).join('')}
    </div></div>`;
  document.getElementById('modal').classList.add('open');
}
function closeModal(e){ if(e.target===document.getElementById('modal'))closeModalBtn(); }
function closeModalBtn(){ document.getElementById('modal').classList.remove('open'); }

function showSection(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  const names=['people','timeline','map','stats','quiz'];
  const idx=names.indexOf(name);
  if(idx>=0)document.querySelectorAll('.nav-link')[idx].classList.add('active');
  if(name==='timeline')renderTimeline();
  if(name==='map')renderMap();
  if(name==='stats')renderStats();
}

function showMapTip(e,name,count){
  const tip=document.getElementById('map-tooltip'); if(!tip)return;
  tip.style.display='block'; tip.style.left=(e.offsetX+14)+'px'; tip.style.top=(e.offsetY-10)+'px';
  tip.textContent=name+'：'+count+'人';
  setTimeout(()=>{tip.style.display='none';},2200);
}

function renderQuestion(){
  const prog=document.getElementById('quiz-progress');
  prog.innerHTML=QUESTIONS.map((q,i)=>`<div class="progress-dot ${i<currentQ?'done':i===currentQ?'active':''}"></div>`).join('');
  const q=QUESTIONS[currentQ];
  document.getElementById('quiz-question-wrap').innerHTML=`
    <div class="quiz-q-label">第 ${currentQ+1} 问 · 共 ${QUESTIONS.length} 问</div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-options">${q.opts.map((o,i)=>`<button class="quiz-option" onclick="selectOpt(${i})">${o.text}</button>`).join('')}</div>`;
}

function selectOpt(idx){ quizAnswers.push(QUESTIONS[currentQ].opts[idx].score); currentQ++; if(currentQ>=QUESTIONS.length)showResult(); else renderQuestion(); }

function showResult(){
  const totals={};
  quizAnswers.forEach(s=>Object.entries(s).forEach(([k,v])=>totals[k]=(totals[k]||0)+v));
  let best=PERSONAS[0],bestScore=-1;
  PERSONAS.forEach(p=>{ let s=0; Object.entries(p.traits).forEach(([k,v])=>s+=(totals[k]||0)*v); if(s>bestScore){bestScore=s;best=p;} });
  const topTraits=Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  document.getElementById('quiz-body').style.display='none';
  const res=document.getElementById('quiz-result');
  res.style.display='block';
  res.innerHTML=`
    <div style="font-size:11px;color:var(--ink-faint);letter-spacing:3px;margin-bottom:10px">镜中所见</div>
    <div class="result-name">${best.name}</div>
    <div class="result-dynasty">${best.dynasty} · 吴中贤人</div>
    <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0">
      ${topTraits.map(t=>`<span class="tag" style="background:rgba(100,80,40,0.1);color:var(--gold);border:1px solid var(--gold);padding:3px 12px;font-size:12px;letter-spacing:1px">${t}</span>`).join('')}
    </div>
    <div class="result-desc">${best.desc}</div>
    <button class="btn-primary" onclick="openPerson(${PEOPLE.find(p=>p.name===best.name)?.id||13})">查阅列传</button>
    <button class="btn-ghost" style="margin-left:8px" onclick="restartQuiz()">重新问心</button>`;
}

function restartQuiz(){ document.getElementById('quiz-intro').style.display='block'; document.getElementById('quiz-body').style.display='none'; document.getElementById('quiz-result').style.display='none'; }

renderPeople();
</script>
